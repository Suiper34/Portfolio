version: "3.8"

services:
  db:
    image: postgres:15
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-suiper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jhaptechinc5566}
      POSTGRES_DB: ${POSTGRES_DB:-jhaps_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-suiper}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # use docker-network host for DB service (compose DNS name = db)
      DATABASE_URI: postgresql+psycopg2://${POSTGRES_USER:-suiper}:${POSTGRES_PASSWORD:-jhaptechinc5566}@db:5432/${POSTGRES_DB:-jhaps_db}
      FLASK_APP: ${FLASK_APP:-app.py}
      FLASK_ENV: ${FLASK_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-my-highly-secure-development-secret-key}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PORT: ${PORT:-8000}
    volumes:
      - ./:/home/appuser/app # optional: live-edit in container for dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
