<!-- flash messages -->
<div class="row mt-3">
    <p class="mb-0 text-dark text-center">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
    <ul class=flashes>
        {% for category, message in messages %}
        <li class="{{ category }}">{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}
    {% endwith %}
    </p>
</div>
